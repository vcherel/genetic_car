repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: tests
        name: Run tests
        entry: bash -c 'if find tests -name "test_*.py" -o -name "*_test.py" 2>/dev/null | grep -q .; then uv run pytest tests/; fi'
        language: system
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    hooks:
      - id: strip-ai-trailers
        name: strip Claude-Session and co-author trailers from the commit message
        entry: sed -i -e '/^Claude-Session:/d' -e '/^Co-Authored-By:/d' -e '/^Generated with/d'
        language: system
        stages: [commit-msg]
